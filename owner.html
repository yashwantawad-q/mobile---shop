<!DOCTYPE html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Owner Dashboard - Sachin Mobile</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <div class="logo">
            Sachin Mobile
        </div>


        <div>

            <button
                onclick="logout()"
                class="logout-btn"
            >
                Logout
            </button>

        </div>

    </header>



    <!-- =====================================================
         OWNER DASHBOARD
    ====================================================== -->

    <main class="owner-container">


        <div class="owner-header">

            <h1>
                Owner Dashboard
            </h1>

            <p>
                Manage your mobile products
            </p>

        </div>



        <!-- =================================================
             ADD / EDIT PRODUCT
        ================================================== -->

        <section class="admin-form-section">

            <h2 id="formTitle">
                Add New Product
            </h2>


            <form id="productForm">


                <!-- Hidden Edit ID -->

                <input
                    type="hidden"
                    id="editId"
                >


                <!-- Product Name -->

                <label>
                    Mobile Name
                </label>

                <input
                    type="text"
                    id="productName"
                    placeholder="Example: iPhone 12"
                    required
                >


                <!-- Price -->

                <label>
                    Price
                </label>

                <input
                    type="number"
                    id="productPrice"
                    placeholder="Example: 28999"
                    min="0"
                    required
                >


                <!-- Condition -->

                <label>
                    Condition
                </label>

                <select
                    id="productCondition"
                    required
                >

                    <option value="">
                        Select Condition
                    </option>

                    <option value="Excellent">
                        Excellent
                    </option>

                    <option value="Good">
                        Good
                    </option>

                    <option value="Average">
                        Average
                    </option>

                </select>


                <!-- Status -->

                <label>
                    Status
                </label>

                <select
                    id="productStatus"
                    required
                >

                    <option value="available">
                        Available
                    </option>

                    <option value="sold">
                        Sold
                    </option>

                </select>


                <!-- Image -->

                <label>
                    Image URL
                </label>

                <input
                    type="url"
                    id="productImage"
                    placeholder="https://example.com/mobile.jpg"
                >


                <!-- Details -->

                <label>
                    Details
                </label>

                <textarea
                    id="productDetails"
                    placeholder="Example: 128GB | 8GB RAM | Clean Condition"
                    rows="4"
                    required
                ></textarea>


                <!-- Buttons -->

                <div class="form-buttons">

                    <button
                        type="submit"
                        id="saveBtn"
                        class="save-btn"
                    >
                        Add Product
                    </button>


                    <button
                        type="button"
                        onclick="resetForm()"
                        class="cancel-btn"
                    >
                        Cancel
                    </button>

                </div>


            </form>

        </section>



        <!-- =================================================
             PRODUCTS
        ================================================== -->

        <section class="admin-products-section">

            <div class="section-title">

                <h2>
                    Products
                </h2>

                <button
                    onclick="displayAdminProducts()"
                    class="refresh-btn"
                >
                    🔄 Refresh
                </button>

            </div>


            <div
                id="adminProducts"
                class="admin-products"
            >

                <div class="empty-admin">
                    Loading products...
                </div>

            </div>

        </section>


    </main>

</body>
