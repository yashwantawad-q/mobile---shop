<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Owner Login - Sachin Mobile</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =================================================
         OWNER LOGIN
    ================================================== -->

    <div class="login-container">

        <div class="login-box">

            <h1>🔐 Owner Login</h1>

            <p>
                Sachin Mobile
            </p>


            <form id="loginForm">

                <input
                    type="email"
                    id="email"
                    placeholder="Owner Email"
                    required
                >


                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >


                <button
                    type="submit"
                    id="loginBtn"
                >
                    Login
                </button>

            </form>


            <p
                id="loginMessage"
                style="margin-top:15px;"
            ></p>


            <a
                href="index.html"
                style="display:block;margin-top:20px;"
            >
                ← Back to Website
            </a>

        </div>

    </div>



    <!-- =================================================
         SUPABASE
    ================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        /* =================================================
           SUPABASE CONFIG
        ================================================= */

        const SUPABASE_URL =
            "https://bqzgwvmleguvbkicyzji.supabase.co";


        const SUPABASE_ANON_KEY =
            "sb_publishable_AcUWdnxtWLVB1mAKD5cUlg_Q6mRfvlg";


        /* =================================================
           CREATE SUPABASE CLIENT
        ================================================= */

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );


        /* =================================================
           LOGIN FORM
        ================================================= */

        const loginForm =
            document.getElementById(
                "loginForm"
            );


        loginForm.addEventListener(
            "submit",
            async function(e) {

                e.preventDefault();


                const email =
                    document.getElementById(
                        "email"
                    ).value.trim();


                const password =
                    document.getElementById(
                        "password"
                    ).value;


                const loginBtn =
                    document.getElementById(
                        "loginBtn"
                    );


                const message =
                    document.getElementById(
                        "loginMessage"
                    );


                loginBtn.disabled = true;

                loginBtn.innerText =
                    "Logging in...";


                message.innerText =
                    "";


                /* =============================================
                   SUPABASE LOGIN
                ============================================== */

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.signInWithPassword({

                        email: email,

                        password: password

                    });


                if(error) {

                    console.error(error);


                    message.style.color =
                        "red";


                    message.innerText =
                        "Login failed: " +
                        error.message;


                    loginBtn.disabled =
                        false;


                    loginBtn.innerText =
                        "Login";


                    return;

                }


                /* =============================================
                   CHECK OWNER PROFILE
                ============================================== */

                const {
                    data: owner,
                    error: ownerError
                } =
                    await supabaseClient
                        .from("owner_profiles")
                        .select("user_id")
                        .eq(
                            "user_id",
                            data.user.id
                        )
                        .maybeSingle();


                if(ownerError) {

                    console.error(
                        ownerError
                    );


                    await supabaseClient
                        .auth
                        .signOut();


                    message.style.color =
                        "red";


                    message.innerText =
                        "Owner verification failed.";


                    loginBtn.disabled =
                        false;


                    loginBtn.innerText =
                        "Login";


                    return;

                }


                if(!owner) {

                    await supabaseClient
                        .auth
                        .signOut();


                    message.style.color =
                        "red";


                    message.innerText =
                        "You are not registered as an owner.";


                    loginBtn.disabled =
                        false;


                    loginBtn.innerText =
                        "Login";


                    return;

                }


                /* =============================================
                   SUCCESS
                ============================================== */

                message.style.color =
                    "green";


                message.innerText =
                    "Login successful!";


                setTimeout(
                    function() {

                        window.location.href =
                            "owner.html";

                    },
                    500
                );

            }
        );

    </script>


</body>

</html>
